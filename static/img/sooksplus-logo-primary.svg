<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 135" width="440" height="540">
  <defs>
    <linearGradient id="spEm" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#0a362f"/><stop offset=".5" stop-color="#0E4D45"/>
      <stop offset="1" stop-color="#1d6b5c"/>
    </linearGradient>
    <linearGradient id="spGd" x1=".85" y1="0" x2=".15" y2="1">
      <stop offset="0" stop-color="#eed9ab"/><stop offset=".35" stop-color="#C9A96E"/>
      <stop offset="1" stop-color="#2f6d5e"/>
    </linearGradient>
  </defs>
  <rect width="110" height="135" fill="#F7F4EE"/>

  <!-- upper ribbon: tapered crescent, deep emerald -->
  <path fill="url(#spEm)"
        d="M74 22
           C 42 6, 14 30, 21 58
           C 26 78, 44 86, 58 100
           C 41 80, 32 66, 33 50
           C 34 30, 54 19, 74 22 Z"/>

  <!-- lower ribbon: same shape rotated 180°, gold to green -->
  <path fill="url(#spGd)"
        d="M74 22
           C 42 6, 14 30, 21 58
           C 26 78, 44 86, 58 100
           C 41 80, 32 66, 33 50
           C 34 30, 54 19, 74 22 Z"
        transform="rotate(180 52 67)"/>

  <!-- 4-point sparkle -->
  <path fill="#C9A96E"
        d="M88 12 L91.4 23.6 L103 27 L91.4 30.4 L88 42 L84.6 30.4 L73 27 L84.6 23.6 Z"/>
</svg>
